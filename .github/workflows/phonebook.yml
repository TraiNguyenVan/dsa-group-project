name: Phonebook checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: make test
      - name: Test the CMake entry point
        run: |
          cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
          printf '1\n7\n9\n' | cmake --build build/cmake --target run-100k | tee build/cmake-demo.log
          grep -F 'Successfully loaded 100000 contacts.' build/cmake-demo.log
          python3 tests/phonebook_smoke.py --cpp-binary build/cmake/demo cpp
